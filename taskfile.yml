version: '3'
dotenv: ['VERSION']
vars:
  APP_NAME: "plan"
  BIN_DIR: "$HOME/.local/bin"
  RELEASE_DIR: ".build/release"
  SWIFT_VERSION: "5.10"
tasks:
  run:
    cmds:
      - swift run {{.APP_NAME}} next
    silent: true
  build:
    watch: true
    sources:
      - '**/*.swift'
    cmds:
      - swift build
    silent: true
  test:
    cmds:
      - swift test
    silent: true
  format:
    cmds:
      - swiftformat --swiftversion {{.SWIFT_VERSION}} Package.swift Sources Tests
    silent: true
  lint:
    cmds:
      - swiftlint
    silent: true
  artifacts:
    deps: [test, lint]
    env:
      CURRENT_HASH:
        sh: git rev-parse --short HEAD
    cmds:
      # BSD and GNU sed spell `-i` differently and `nix develop` puts GNU sed
      # ahead of /usr/bin/sed, so write through a temp file instead.
      - sed "s/APP_VERSION/$APP_VERSION-$CURRENT_HASH/g" Sources/Version.swift > Sources/Version.swift.tmp
      - mv Sources/Version.swift.tmp Sources/Version.swift
      - swift build --configuration release --disable-sandbox --arch arm64
      - git checkout Sources/Version.swift
    silent: true
  install:
    requires:
      vars: [APP_NAME, BIN_DIR]
    deps: [artifacts]
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - cp "{{.RELEASE_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}"
  uninstall:
    requires:
      vars: [APP_NAME, BIN_DIR]
    cmds:
      - rm -rf "{{.BIN_DIR}}/{{.APP_NAME}}"
    silent: true
  tar:
    deps: [artifacts]
    cmds:
      - cp {{.RELEASE_DIR}}/{{.APP_NAME}} {{.RELEASE_DIR}}/{{.APP_NAME}}-darwin-arm64
      - tar -czf {{.RELEASE_DIR}}/plan-"$(echo "$APP_VERSION" | cut -c2-)".tar.gz -C .build/release {{.APP_NAME}}-darwin-arm64
  tag:
    deps: [tar]
    cmds:
      - git tag "$APP_VERSION"
      - git push origin "$APP_VERSION"
  release:
    deps: [tag]
    requires:
      vars: [APP_NAME, RELEASE_DIR]
    cmds:
      - /opt/homebrew/bin/gh auth status
      - /opt/homebrew/bin/gh release create --generate-notes "$APP_VERSION" {{.RELEASE_DIR}}/plan-"$(echo "$APP_VERSION" | cut -c2-)".tar.gz
  sha:
    requires:
      vars: [APP_NAME, RELEASE_DIR]
    cmds:
      - sha256sum {{.RELEASE_DIR}}/{{.APP_NAME}}-*
  # Run after `task release`, never before: `release` re-runs `tar`, and
  # tar/gzip embed mtimes, so a locally rebuilt archive is not byte-identical
  # to the one that was uploaded. Prefetching the published URL is the only
  # way to get the hash `flake.nix` actually needs.
  nix-hash:
    requires:
      vars: [APP_NAME]
    cmds:
      - |
        VERSION="$(echo "$APP_VERSION" | cut -c2-)"
        HASH=$(nix store prefetch-file --json \
          "https://github.com/oschrenk/plan.swift/releases/download/$APP_VERSION/{{.APP_NAME}}-$VERSION.tar.gz" \
          | jq -r .hash)
        sed "s|hash = \"sha256-[^\"]*\";|hash = \"$HASH\";|" flake.nix > flake.nix.tmp
        mv flake.nix.tmp flake.nix
        echo "flake.nix hash -> $HASH"
  clean:
    cmds:
      - rm -rf .build
    silent: true
